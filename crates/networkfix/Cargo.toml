[package]
name = "networkfix"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "networkfix"
path = "src/main.rs"

[dependencies]
networkfix-core = { path = "../networkfix-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json = "1"
